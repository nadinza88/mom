<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мама-сборы 😂</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #ffe8c7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            touch-action: pan-y;
        }
        #gameWrapper {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 9 / 16;
            background: #feda7a;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 0 #b47d44, 0 30px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            touch-action: none;
            border: 6px solid #fce1a4;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #b3d9f7;
            touch-action: none;
            cursor: grab;
            border-radius: 40px;
        }
        #ui {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 0 16px;
            pointer-events: none;
        }
        #ui button {
            pointer-events: auto;
            background: #ffb347;
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #3d2b1a;
            box-shadow: 0 8px 0 #b86f1f, 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.07s ease;
            touch-action: manipulation;
            border: 3px solid #ffd58c;
            letter-spacing: 0.5px;
            flex: 1;
            max-width: 200px;
            font-family: 'Comic Sans MS', cursive;
        }
        #ui button:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #b86f1f;
        }
        #messageBox {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(255, 240, 180, 0.95);
            padding: 14px 16px;
            border-radius: 60px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #2a1c0a;
            box-shadow: 0 6px 0 #dba14b, 0 8px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
            border: 3px solid #fad48b;
            pointer-events: none;
            min-height: 3.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
            font-family: 'Comic Sans MS', cursive;
        }
        #messageBox span {
            background: #ffe28a;
            padding: 0 14px;
            border-radius: 40px;
            margin: 0 6px;
        }
        @media (max-width: 480px) {
            #gameWrapper {
                border-radius: 28px;
                max-width: 100vw;
                aspect-ratio: 9 / 16;
                border-width: 4px;
            }
            #ui button {
                font-size: 1rem;
                padding: 12px 16px;
            }
            #messageBox {
                font-size: 1rem;
                padding: 10px 14px;
                top: 10px;
                left: 10px;
                right: 10px;
                min-height: 3rem;
            }
        }
        @media (max-height: 700px) {
            #messageBox {
                font-size: 0.85rem;
                padding: 6px 12px;
                min-height: 2.4rem;
                top: 8px;
            }
            #ui button {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div id="gameWrapper">
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    <div id="messageBox">🏠 Собери все вещи!</div>
    <div id="ui">
        <button id="resetBtn">🔄 Заново</button>
    </div>
</div>
<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('messageBox');

        const W = 360, H = 640;
        canvas.width = W; canvas.height = H;

        // ----- Персонажи (мультяшные) -----
        let mom = { x: 160, y: 480, r: 28, color: '#d96c9e' };

        const child1 = { x: 60, y: 140, r: 24, color: '#f5a97f', name: 'Алиса' };
        const child2 = { x: 280, y: 190, r: 24, color: '#7fc9a2', name: 'Макс' };

        // Одежда с разными эмодзи
        let clothes = [
            { x: 30, y: 350, r: 18, collected: false, emoji: '🧢' },
            { x: 310, y: 370, r: 18, collected: false, emoji: '🧣' },
            { x: 170, y: 300, r: 18, collected: false, emoji: '🧥' },
            { x: 70, y: 540, r: 18, collected: false, emoji: '👖' },
            { x: 260, y: 550, r: 18, collected: false, emoji: '👟' },
            { x: 140, y: 210, r: 18, collected: false, emoji: '🧦' }
        ];

        let allCollected = false;
        let gameFinished = false;
        let winFlag = false;
        let child1Ready = false, child2Ready = false;

        // Перетаскивание
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let activeClothIndex = -1;

        // ----- Сброс -----
        function resetGame() {
            mom.x = 160; mom.y = 480;
            // разброс одежды
            const positions = [
                [30,350],[310,370],[170,300],[70,540],[260,550],[140,210]
            ];
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            clothes.forEach((c, idx) => {
                c.x = positions[idx][0];
                c.y = positions[idx][1];
                c.collected = false;
            });
            allCollected = false;
            gameFinished = false;
            winFlag = false;
            child1Ready = false;
            child2Ready = false;
            isDragging = false;
            activeClothIndex = -1;
            messageEl.innerHTML = '🧸 Тащи одежду к детям!';
            // дети на своих местах
            child1.x = 60; child1.y = 140;
            child2.x = 280; child2.y = 190;
        }

        function checkAllCollected() {
            return clothes.every(c => c.collected === true);
        }

        function updateGameState() {
            if (gameFinished) return;

            const allCollectedNow = checkAllCollected();
            if (allCollectedNow && !allCollected) {
                allCollected = true;
                child1Ready = true;
                child2Ready = true;
                messageEl.innerHTML = '🎉 Всё собрано! Мама ведёт гулять...';
                setTimeout(() => {
                    if (!gameFinished) {
                        gameFinished = true;
                        winFlag = false;
                        messageEl.innerHTML = '👧 "Мааам, я хочу пиииисать!" 😂';
                        // дети "убегают" вниз
                        child1.x = 40; child1.y = 580;
                        child2.x = 300; child2.y = 580;
                        mom.x = 160; mom.y = 400;
                        // добавим смешные лица
                    }
                }, 1600);
            } else if (!allCollectedNow) {
                allCollected = false;
                if (!gameFinished) {
                    const left = clothes.filter(c => !c.collected).length;
                    messageEl.innerHTML = `🧦 Осталось: ${left} вещей`;
                }
            }
        }

        // ----- Рисование -----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Пол с узором
            ctx.fillStyle = '#d8b48c';
            ctx.fillRect(0, 480, W, 160);
            ctx.fillStyle = '#c9a57a';
            for (let i=0; i<14; i++) {
                ctx.beginPath();
                ctx.arc(15 + i*28, 520, 12, 0, Math.PI*2);
                ctx.fillStyle = (i%2===0) ? '#e3c9a8' : '#b48d62';
                ctx.fill();
            }

            // Стены с обоями
            ctx.fillStyle = '#fce8c8';
            ctx.fillRect(0, 0, W, 480);
            // Рисунок на стене
            ctx.fillStyle = '#f5dbb1';
            ctx.fillRect(20, 20, 60, 60);
            ctx.fillStyle = '#fce8c8';
            ctx.fillRect(25, 25, 50, 50);
            ctx.fillStyle = '#f5dbb1';
            ctx.fillRect(270, 20, 60, 60);
            ctx.fillStyle = '#fce8c8';
            ctx.fillRect(275, 25, 50, 50);
            // Солнышко
            ctx.fillStyle = '#ffdb7a';
            ctx.beginPath();
            ctx.arc(310, 50, 20, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#f7c54a';
            for (let i=0; i<8; i++) {
                let angle = i * Math.PI/4;
                ctx.beginPath();
                ctx.arc(310 + Math.cos(angle)*28, 50 + Math.sin(angle)*28, 6, 0, Math.PI*2);
                ctx.fill();
            }

            // Дети
            drawChild(child1);
            drawChild(child2);

            // Одежда
            clothes.forEach(c => {
                if (!c.collected) {
                    ctx.shadowColor = '#4a2e14';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
                    ctx.fillStyle = '#f7d48a';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = '24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(c.emoji, c.x, c.y-1);
                    // блеск
                    ctx.fillStyle = 'rgba(255,255,230,0.3)';
                    ctx.beginPath();
                    ctx.arc(c.x-4, c.y-6, 6, 0, Math.PI*2);
                    ctx.fill();
                }
            });

            // Мама (с лицом)
            ctx.shadowColor = '#3d2412';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(mom.x, mom.y, mom.r, 0, Math.PI*2);
            ctx.fillStyle = mom.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👩', mom.x-1, mom.y-2);

            // Если финал шутка
            if (gameFinished && !winFlag) {
                ctx.font = '28px sans-serif';
                ctx.fillStyle = '#2d1a0a';
                ctx.fillText('😱', mom.x+32, mom.y-30);
                // облачко
                ctx.fillStyle = 'rgba(255,255,230,0.85)';
                ctx.beginPath();
                ctx.ellipse(mom.x+50, mom.y-50, 40, 25, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#2d1a0a';
                ctx.font = '18px sans-serif';
                ctx.fillText('Ой!', mom.x+50, mom.y-48);
            }

            // если победа (но не используется)
            if (winFlag) {
                ctx.fillStyle = '#fddf8a';
                ctx.fillRect(60, 220, 240, 70);
                ctx.fillStyle = '#3d2b1a';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('🎈 УРА! 🎈', 180, 258);
            }
        }

        function drawChild(child) {
            ctx.shadowColor = '#1f1307';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(child.x, child.y, child.r, 0, Math.PI*2);
            ctx.fillStyle = child.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = '28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧒', child.x-1, child.y-1);
            ctx.fillStyle = '#1f1509';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(child.name, child.x, child.y - child.r - 14);
        }

        // ----- Ввод -----
        function handleStart(e) {
            e.preventDefault();
            if (gameFinished) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            for (let i = 0; i < clothes.length; i++) {
                const c = clothes[i];
                if (c.collected) continue;
                const dx = canvasX - c.x;
                const dy = canvasY - c.y;
                if (dx*dx + dy*dy < (c.r+16)*(c.r+16)) {
                    isDragging = true;
                    activeClothIndex = i;
                    dragOffsetX = canvasX - c.x;
                    dragOffsetY = canvasY - c.y;
                    break;
                }
            }
        }

        function handleMove(e) {
            e.preventDefault();
            if (!isDragging || activeClothIndex === -1 || gameFinished) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;

            canvasX = Math.min(W-12, Math.max(12, canvasX));
            canvasY = Math.min(H-12, Math.max(12, canvasY));

            const cloth = clothes[activeClothIndex];
            cloth.x = canvasX - dragOffsetX;
            cloth.y = canvasY - dragOffsetY;
            mom.x += (cloth.x - mom.x) * 0.25;
            mom.y += (cloth.y - mom.y) * 0.25;
        }

        function handleEnd(e) {
            e.preventDefault();
            if (!isDragging || activeClothIndex === -1 || gameFinished) {
                isDragging = false;
                activeClothIndex = -1;
                return;
            }

            const cloth = clothes[activeClothIndex];
            const children = [child1, child2];
            let collected = false;
            for (let child of children) {
                const dx = cloth.x - child.x;
                const dy = cloth.y - child.y;
                if (dx*dx + dy*dy < (cloth.r + child.r + 12) * (cloth.r + child.r + 12)) {
                    cloth.collected = true;
                    collected = true;
                    break;
                }
            }

            if (!collected && !cloth.collected) {
                cloth.x = 25 + Math.random() * 310;
                cloth.y = 200 + Math.random() * 280;
            }

            isDragging = false;
            activeClothIndex = -1;
            updateGameState();
            draw();
        }

        // События
        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd, { passive: false });

        document.getElementById('resetBtn').addEventListener('click', (e) => {
            e.preventDefault();
            resetGame();
            draw();
        });

        resetGame();
        draw();

        setInterval(() => { draw(); }, 300);
    })();
</script>
</body>
</html>
