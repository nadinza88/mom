<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Выпусти пар - Ретро игра</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  #gameWrapper {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #gameCanvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #0a0a1a;
  }

  .bubble {
    position: absolute;
    background: #fff;
    color: #000;
    padding: 10px 16px;
    font-size: 18px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    border: 3px solid #000;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 20;
    box-shadow: 4px 4px 0 #000;
  }

  .bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 20px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 14px solid #000;
  }

  .bubble::before {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 23px;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 10px solid #fff;
    z-index: 1;
  }

  .bubble.show { opacity: 1; }

  #womanBubble { top: 15%; left: 10%; }
  #manBubble { top: 15%; right: 10%; }

  .counter {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 28px;
    color: #FFD700;
    font-weight: bold;
    text-shadow: 3px 3px 0 #000;
    font-family: 'Courier New', monospace;
    z-index: 30;
    display: none;
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border: 3px solid #FFD700;
  }

  .counter.show { display: block; }

  .final-text {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 42px;
    color: #FFD700;
    font-weight: bold;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    font-family: 'Courier New', monospace;
    z-index: 40;
    text-align: center;
    pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .final-text.show { transform: translate(-50%, -50%) scale(1); }

  .restart-btn {
    position: fixed;
    bottom: -120px;
    left: 50%;
    transform: translateX(-50%);
    padding: 18px 40px;
    font-size: 22px;
    font-weight: bold;
    color: #FFF;
    background: linear-gradient(135deg, #FF6B6B, #EE5A6F);
    border: 4px solid #FFF;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    text-shadow: 2px 2px 0 #000;
    box-shadow: 0 6px 0 #000;
    transition: bottom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 50;
    letter-spacing: 2px;
  }

  .restart-btn.show { bottom: 40px; }

  .restart-btn:active {
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 2px 0 #000;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #FFD700;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    text-shadow: 2px 2px 0 #000;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.5s;
    text-align: center;
    pointer-events: none;
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border: 2px solid #FFD700;
  }

  .hint.show { opacity: 1; animation: blink 1s infinite; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 35;
    transition: opacity 0.1s;
  }

  .flash.active { opacity: 1; }

  @media (max-width: 600px) {
    .bubble { font-size: 14px; padding: 8px 12px; }
    .counter { font-size: 20px; padding: 6px 12px; }
    .final-text { font-size: 28px; }
    .restart-btn { font-size: 18px; padding: 14px 30px; }
    .hint { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="bubble" id="womanBubble">Работать пойдем?</div>
  <div class="bubble" id="manBubble">Не хочу</div>
</div>

<div class="counter" id="counter">0 / 15</div>
<div class="hint" id="hint">👆 НАЖМИ НА МУЖИКА!</div>
<div class="final-text" id="finalText">Уф! Выпустила пар 💨</div>
<div class="flash" id="flash"></div>
<button class="restart-btn" id="restartBtn">ПОВТОРИТЬ</button>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const womanBubbleEl = document.getElementById('womanBubble');
  const manBubbleEl = document.getElementById('manBubble');
  const counterEl = document.getElementById('counter');
  const hintEl = document.getElementById('hint');
  const finalTextEl = document.getElementById('finalText');
  const flashEl = document.getElementById('flash');
  const restartBtn = document.getElementById('restartBtn');

  let W = 0, H = 0;
  let PIXEL = 4; // адаптивный размер "пикселя"

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const aspect = 16 / 10;

    let w, h;
    if (maxW / maxH > aspect) {
      h = maxH;
      w = h * aspect;
    } else {
      w = maxW;
      h = w / aspect;
    }

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);

    W = canvas.width;
    H = canvas.height;

    // Адаптивный размер пикселя - чтобы персонажи были хорошо видны
    // Персонаж ~30 пикселей высотой, должен занимать ~35% высоты экрана
    PIXEL = Math.max(3, Math.floor(H / 85));

    ctx.imageSmoothingEnabled = false;

    // Пересчитываем позиции при ресайзе
    if (state) {
      recalcPositions();
    }
  }

  // Цвета
  const C = {
    skin: '#FFDBAC',
    skinDark: '#E8B890',
    hairW: '#8B4513',
    hairM: '#3E2723',
    dress: '#E91E63',
    dressDark: '#AD1457',
    shirt: '#1E88E5',
    shirtDark: '#1565C0',
    pants: '#424242',
    pantsDark: '#212121',
    bat: '#6D4C41',
    batDark: '#4E342E',
    black: '#000',
    white: '#FFF',
    yellow: '#FFD700',
    red: '#F44336',
    purple: '#9C27B0'
  };

  const state = {
    phase: 'intro',
    t: 0,
    womanX: 0,
    womanY: 0,
    manX: 0,
    manY: 0,
    walkFrame: 0,
    hits: 0,
    maxHits: 15,
    hitAnim: 0,
    manShake: 0,
    batAngle: 0,
    stars: [],
    flashAlpha: 0,
    finished: false
  };

  // Пересчёт позиций при изменении размера
  function recalcPositions() {
    const groundY = H * 0.78;
    state.womanY = groundY;
    state.manY = groundY;
    state.manX = W * 0.72;

    // Если женщина ещё не дошла до мужчины (фаза intro) - пересчитать её позицию
    if (state.phase === 'intro') {
      // Оставляем womanX как есть, но ограничиваем, чтобы не была слишком далеко
      const targetX = state.manX - 45 * PIXEL;
      if (state.womanX < -W * 0.3) {
        state.womanX = -W * 0.15;
      }
      // Если уже дошла - фиксируем у цели
      if (state.womanX >= targetX - 5) {
        state.womanX = targetX;
      }
    } else {
      // В других фазах - женщина уже у мужчины
      state.womanX = state.manX - 45 * PIXEL;
    }
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
  }

  // Рисование женщины
  function drawWoman(x, y, walkFrame, batAngle) {
    const s = PIXEL;
    const bx = Math.floor(x);
    const by = Math.floor(y);

    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(bx + 10*s, by + 28*s, 12*s, 2*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Волосы (до плеч)
    rect(bx + 3*s, by - 2*s, 14*s, 8*s, C.hairW);
    rect(bx + 2*s, by + 4*s, 3*s, 8*s, C.hairW);
    rect(bx + 15*s, by + 4*s, 3*s, 8*s, C.hairW);

    // Голова
    rect(bx + 4*s, by + 0*s, 12*s, 10*s, C.skin);
    rect(bx + 4*s, by + 9*s, 12*s, 2*s, C.skinDark);

    // Глаза
    rect(bx + 6*s, by + 4*s, 2*s, 2*s, C.black);
    rect(bx + 12*s, by + 4*s, 2*s, 2*s, C.black);
    rect(bx + 6*s, by + 4*s, s, s, C.white);
    rect(bx + 12*s, by + 4*s, s, s, C.white);

    // Рот (злой в фазе ударов)
    if (state.phase === 'hitting' || state.phase === 'finished') {
      rect(bx + 8*s, by + 7*s, 4*s, s, C.red);
      rect(bx + 8*s, by + 8*s, 4*s, s, C.black);
    } else {
      rect(bx + 8*s, by + 7*s, 4*s, s, C.black);
    }

    // Шея
    rect(bx + 8*s, by + 10*s, 4*s, 2*s, C.skin);

    // Платье
    rect(bx + 4*s, by + 12*s, 12*s, 8*s, C.dress);
    rect(bx + 4*s, by + 19*s, 12*s, s, C.dressDark);
    rect(bx + 4*s, by + 16*s, 12*s, s, C.yellow);

    // Юбка
    rect(bx + 3*s, by + 20*s, 14*s, 4*s, C.dress);

    // Левая рука
    rect(bx + 1*s, by + 12*s, 3*s, 8*s, C.skin);
    rect(bx + 1*s, by + 19*s, 3*s, 2*s, C.skinDark);

    // Правая рука с дубинкой
    ctx.save();
    ctx.translate(bx + 16*s, by + 13*s);
    ctx.rotate(batAngle);
    rect(0, 0, 3*s, 8*s, C.skin);
    rect(-s, -14*s, 5*s, 16*s, C.bat);
    rect(-s, -14*s, 5*s, 2*s, C.batDark);
    rect(-s, 0, 5*s, 2*s, C.batDark);
    ctx.restore();

    // Ноги
    const legOff = walkFrame % 2 === 0 ? 0 : 1;
    rect(bx + 5*s, by + 24*s, 3*s, 4*s - legOff*s, C.skin);
    rect(bx + 12*s, by + 24*s, 3*s, 4*s - (1-legOff)*s, C.skin);
    rect(bx + 4*s, by + 27*s - legOff*s, 5*s, 2*s, C.black);
    rect(bx + 11*s, by + 27*s - (1-legOff)*s, 5*s, 2*s, C.black);
  }

  // Рисование мужчины
  function drawMan(x, y, shakeX, shakeY) {
    const s = PIXEL;
    const bx = Math.floor(x + shakeX);
    const by = Math.floor(y + shakeY);

    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(bx + 10*s, by + 28*s, 12*s, 2*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Волосы
    rect(bx + 3*s, by - s, 14*s, 4*s, C.hairM);
    rect(bx + 3*s, by + 2*s, 2*s, 2*s, C.hairM);

    // Голова
    rect(bx + 4*s, by + 0*s, 12*s, 10*s, C.skin);
    rect(bx + 4*s, by + 9*s, 12*s, 2*s, C.skinDark);

    // Глаза
    if (state.hitAnim > 0) {
      rect(bx + 6*s, by + 4*s, 2*s, s, C.black);
      rect(bx + 7*s, by + 3*s, s, s, C.black);
      rect(bx + 7*s, by + 5*s, s, s, C.black);
      rect(bx + 12*s, by + 4*s, 2*s, s, C.black);
      rect(bx + 13*s, by + 3*s, s, s, C.black);
      rect(bx + 13*s, by + 5*s, s, s, C.black);
      rect(bx + 8*s, by + 7*s, 4*s, 2*s, C.black);
      rect(bx + 9*s, by + 8*s, 2*s, s, C.red);
    } else {
      rect(bx + 6*s, by + 4*s, 2*s, 2*s, C.black);
      rect(bx + 12*s, by + 4*s, 2*s, 2*s, C.black);
      rect(bx + 6*s, by + 4*s, s, s, C.white);
      rect(bx + 12*s, by + 4*s, s, s, C.white);
      rect(bx + 8*s, by + 7*s, 4*s, s, C.black);
    }

    // Шея
    rect(bx + 8*s, by + 10*s, 4*s, 2*s, C.skin);

    // Футболка
    rect(bx + 3*s, by + 12*s, 14*s, 8*s, C.shirt);
    rect(bx + 3*s, by + 19*s, 14*s, s, C.shirtDark);
    rect(bx + 1*s, by + 12*s, 3*s, 3*s, C.shirt);
    rect(bx + 16*s, by + 12*s, 3*s, 3*s, C.shirt);

    // Руки
    const armShake = state.hitAnim > 0 ? Math.sin(state.hitAnim * 0.5) * 2 : 0;
    rect(bx + 1*s, by + 15*s + armShake, 3*s, 6*s, C.skin);
    rect(bx + 16*s, by + 15*s - armShake, 3*s, 6*s, C.skin);

    // Штаны
    rect(bx + 4*s, by + 20*s, 5*s, 5*s, C.pants);
    rect(bx + 11*s, by + 20*s, 5*s, 5*s, C.pants);
    rect(bx + 4*s, by + 24*s, 5*s, s, C.pantsDark);
    rect(bx + 11*s, by + 24*s, 5*s, s, C.pantsDark);

    // Ботинки
    rect(bx + 3*s, by + 25*s, 6*s, 2*s, C.black);
    rect(bx + 11*s, by + 25*s, 6*s, 2*s, C.black);

    // Синяк
    if (state.hitAnim > 10) {
      ctx.fillStyle = C.purple;
      ctx.globalAlpha = state.hitAnim / 30;
      ctx.beginPath();
      ctx.ellipse(bx + 7*s, by + 2*s, 3*s, 2*s, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Звёздочки при ударе
  function drawStars() {
    state.stars.forEach(star => {
      ctx.save();
      ctx.translate(star.x, star.y);
      ctx.rotate(star.rot);
      ctx.fillStyle = star.color;
      ctx.globalAlpha = star.life / star.maxLife;
      const sz = star.size;
      ctx.fillRect(-sz/2, -sz*1.5, sz, sz*3);
      ctx.fillRect(-sz*1.5, -sz/2, sz*3, sz);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  // Фон
  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(0.6, '#1a1a4e');
    grad.addColorStop(1, '#2d1a4e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Звёзды на небе
    ctx.fillStyle = '#FFF';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5) % W;
      const sy = (i * 73.3) % (H * 0.6);
      const twinkle = Math.sin(state.t * 0.05 + i) * 0.5 + 0.5;
      ctx.globalAlpha = twinkle;
      ctx.fillRect(sx, sy, PIXEL, PIXEL);
    }
    ctx.globalAlpha = 1;

    // Луна
    const moonR = Math.max(20, H * 0.04);
    ctx.fillStyle = '#FFF9C4';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.15, moonR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a2e';
    ctx.beginPath();
    ctx.arc(W * 0.85 + moonR * 0.3, H * 0.15 - moonR * 0.2, moonR * 0.85, 0, Math.PI * 2);
    ctx.fill();

    // Земля
    const groundY = H * 0.78 + 28 * PIXEL;
    ctx.fillStyle = '#2d4a2b';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#1a2e18';
    ctx.fillRect(0, groundY, W, PIXEL * 2);

    // Травинки
    ctx.fillStyle = '#4CAF50';
    for (let i = 0; i < W; i += PIXEL * 4) {
      ctx.fillRect(i, groundY - PIXEL, PIXEL, PIXEL);
      if (i % (PIXEL * 8) === 0) {
        ctx.fillRect(i + PIXEL, groundY - PIXEL * 2, PIXEL, PIXEL);
      }
    }
  }

  function update() {
    state.t++;

    if (state.phase === 'intro') {
      const targetX = state.manX - 45 * PIXEL;
      // Скорость зависит от размера экрана - всегда одинаковое время
      const speed = Math.max(2, W / 200);
      state.womanX += speed;
      state.walkFrame = Math.floor(state.t / 8) % 2;

      if (state.womanX >= targetX) {
        state.womanX = targetX;
        state.phase = 'dialogue';
        state.t = 0;
      }
    }

    if (state.phase === 'dialogue') {
      if (state.t === 30) womanBubbleEl.classList.add('show');
      if (state.t === 120) manBubbleEl.classList.add('show');
      if (state.t === 210) {
        womanBubbleEl.classList.remove('show');
        manBubbleEl.classList.remove('show');
        state.phase = 'hitting';
        state.t = 0;
        counterEl.classList.add('show');
        hintEl.classList.add('show');
      }
    }

    if (state.phase === 'hitting') {
      if (state.hitAnim > 0) {
        state.hitAnim--;
        if (state.hitAnim > 15) {
          state.batAngle = -Math.PI / 2 - (state.hitAnim - 15) * 0.05;
        } else {
          state.batAngle = -Math.PI / 2 + (15 - state.hitAnim) * 0.15;
        }
        state.manShake = Math.sin(state.hitAnim * 0.8) * (state.hitAnim / 3);
      } else {
        state.batAngle = 0;
        state.manShake = 0;
      }
    }

    state.stars = state.stars.filter(s => {
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.3;
      s.rot += s.vr;
      s.life--;
      return s.life > 0;
    });
  }

  function draw() {
    drawBackground();
    drawMan(state.manX, state.manY, state.manShake, 0);
    drawWoman(state.womanX, state.womanY, state.walkFrame, state.batAngle);
    drawStars();

    if (state.flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${state.flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
      state.flashAlpha -= 0.05;
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function handleHit(clientX, clientY) {
    if (state.phase !== 'hitting') return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;

    const s = PIXEL;
    const manLeft = state.manX - 5 * s;
    const manRight = state.manX + 22 * s;
    const manTop = state.manY - 5 * s;
    const manBottom = state.manY + 28 * s;

    if (x >= manLeft && x <= manRight && y >= manTop && y <= manBottom) {
      state.hits++;
      state.hitAnim = 30;
      counterEl.textContent = `${state.hits} / ${state.maxHits}`;
      hintEl.classList.remove('show');

      const hitX = state.manX + 10 * s;
      const hitY = state.manY + 3 * s;
      const colors = ['#FFD700', '#FF5722', '#FFEB3B', '#FF9800', '#FFF'];
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
        const speed = 4 + Math.random() * 4;
        state.stars.push({
          x: hitX,
          y: hitY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          size: s * (1 + Math.random()),
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 30,
          maxLife: 30
        });
      }

      if (state.hits >= state.maxHits) {
        finishGame();
      }
    }
  }

  function finishGame() {
    state.phase = 'finished';
    state.finished = true;
    state.flashAlpha = 1;
    counterEl.classList.remove('show');
    hintEl.classList.remove('show');

    flashEl.classList.add('active');
    setTimeout(() => flashEl.classList.remove('active'), 150);

    setTimeout(() => finalTextEl.classList.add('show'), 400);
    setTimeout(() => restartBtn.classList.add('show'), 1200);
  }

  function resetGame() {
    state.phase = 'intro';
    state.t = 0;
    state.hits = 0;
    state.hitAnim = 0;
    state.manShake = 0;
    state.batAngle = 0;
    state.stars = [];
    state.flashAlpha = 0;
    state.finished = false;
    state.walkFrame = 0;

    recalcPositions();
    state.womanX = -W * 0.15;

    counterEl.classList.remove('show');
    counterEl.textContent = '0 / 15';
    hintEl.classList.remove('show');
    finalTextEl.classList.remove('show');
    restartBtn.classList.remove('show');
    womanBubbleEl.classList.remove('show');
    manBubbleEl.classList.remove('show');
    flashEl.classList.remove('active');
  }

  // События
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      handleHit(t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener('mousedown', function(e) {
    handleHit(e.clientX, e.clientY);
  });

  canvas.addEventListener('click', function(e) {
    e.preventDefault();
  });

  restartBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    resetGame();
  });

  restartBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    e.stopPropagation();
    resetGame();
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (e.target === canvas) e.preventDefault();
  }, { passive: false });

  document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
  });

  // Инициализация
  resize();
  recalcPositions();
  state.womanX = -W * 0.15;
  loop();

  // Повторный вызов resize после полной загрузки для корректных размеров
  window.addEventListener('load', function() {
    resize();
  });
})();
</script>
</body>
</html>
