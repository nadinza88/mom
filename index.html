<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выпусти пар - Ретро игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            cursor: pointer;
        }

        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }

        .restart-btn {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #FFF;
            background: linear-gradient(135deg, #FF6B6B, #EE5A6F);
            border: 4px solid #FFF;
            border-radius: 0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 4px 0 #000;
            transition: bottom 0.5s ease;
            z-index: 10;
        }

        .restart-btn.show {
            bottom: 50px;
        }

        .restart-btn:active {
            transform: translateX(-50%) translateY(4px);
            box-shadow: 0 0 0 #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="counter" id="counter"></div>
    <button class="restart-btn" id="restartBtn">ПОВТОРИТЬ</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const counter = document.getElementById('counter');
        const restartBtn = document.getElementById('restartBtn');

        // Настройки canvas
        const PIXEL_SIZE = 4;
        let canvasWidth, canvasHeight;

        function resizeCanvas() {
            const aspectRatio = 16 / 9;
            let width = window.innerWidth;
            let height = window.innerHeight;

            if (width / height > aspectRatio) {
                width = height * aspectRatio;
            } else {
                height = width / aspectRatio;
            }

            canvas.width = Math.floor(width / PIXEL_SIZE);
            canvas.height = Math.floor(height / PIXEL_SIZE);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Состояние игры
        const gameState = {
            phase: 'intro', // intro, dialogue, hitting, finished
            womanX: 0,
            womanY: 0,
            manX: 0,
            manY: 0,
            hits: 0,
            maxHits: 15,
            animationFrame: 0,
            walkFrame: 0,
            hitAnimation: 0,
            dialogueTimer: 0,
            womanBubble: '',
            manBubble: '',
            stars: [],
            flash: 0
        };

        // Цвета
        const COLORS = {
            skin: '#FFDBAC',
            hairWoman: '#8B4513',
            hairMan: '#654321',
            dress: '#FF69B4',
            shirt: '#4169E1',
            pants: '#2F4F4F',
            bat: '#8B4513',
            eyes: '#000',
            white: '#FFF',
            black: '#000',
            yellow: '#FFD700'
        };

        // Спрайты персонажей (пиксельные массивы)
        function drawPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
        }

        function drawWoman(x, y, frame, hasBat = false, batAngle = 0) {
            const px = Math.floor(x);
            const py = Math.floor(y);

            // Волосы
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 4; j++) {
                    drawPixel(px + i, py + j, COLORS.hairWoman);
                }
            }
            // Голова
            for (let i = 1; i < 9; i++) {
                for (let j = 4; j < 10; j++) {
                    drawPixel(px + i, py + j, COLORS.skin);
                }
            }
            // Глаза
            drawPixel(px + 3, py + 6, COLORS.eyes);
            drawPixel(px + 6, py + 6, COLORS.eyes);
            // Рот
            drawPixel(px + 4, py + 8, COLORS.eyes);
            drawPixel(px + 5, py + 8, COLORS.eyes);

            // Тело (платье)
            for (let i = 2; i < 8; i++) {
                for (let j = 10; j < 18; j++) {
                    drawPixel(px + i, py + j, COLORS.dress);
                }
            }

            // Руки
            const armOffset = frame % 2 === 0 ? 0 : 1;
            for (let j = 11; j < 15; j++) {
                drawPixel(px + 1, py + j + armOffset, COLORS.skin);
                drawPixel(px + 8, py + j - armOffset, COLORS.skin);
            }

            // Дубинка
            if (hasBat) {
                const batX = px + 9;
                const batY = py + 10;
                const angle = batAngle;
                
                for (let i = 0; i < 8; i++) {
                    const bx = batX + Math.cos(angle) * i;
                    const by = batY + Math.sin(angle) * i;
                    drawPixel(Math.floor(bx), Math.floor(by), COLORS.bat);
                }
            }

            // Ноги
            const legOffset = frame % 2 === 0 ? 0 : 1;
            for (let j = 18; j < 22; j++) {
                drawPixel(px + 3, py + j + legOffset, COLORS.skin);
                drawPixel(px + 6, py + j - legOffset, COLORS.skin);
            }
        }

        function drawMan(x, y, frame, hit = false) {
            const px = Math.floor(x);
            const py = Math.floor(y);

            // Волосы
            for (let i = 1; i < 9; i++) {
                for (let j = 0; j < 3; j++) {
                    drawPixel(px + i, py + j, COLORS.hairMan);
                }
            }
            // Голова
            for (let i = 1; i < 9; i++) {
                for (let j = 3; j < 9; j++) {
                    drawPixel(px + i, py + j, COLORS.skin);
                }
            }
            // Глаза
            drawPixel(px + 3, py + 5, COLORS.eyes);
            drawPixel(px + 6, py + 5, COLORS.eyes);
            // Рот
            drawPixel(px + 4, py + 7, COLORS.eyes);
            drawPixel(px + 5, py + 7, COLORS.eyes);

            // Тело (футболка)
            for (let i = 2; i < 8; i++) {
                for (let j = 9; j < 16; j++) {
                    drawPixel(px + i, py + j, COLORS.shirt);
                }
            }

            // Руки
            const armOffset = hit ? 2 : 0;
            for (let j = 10; j < 14; j++) {
                drawPixel(px + 1, py + j + armOffset, COLORS.skin);
                drawPixel(px + 8, py + j + armOffset, COLORS.skin);
            }

            // Ноги (штаны)
            const legOffset = frame % 2 === 0 ? 0 : 1;
            for (let j = 16; j < 21; j++) {
                drawPixel(px + 3, py + j + legOffset, COLORS.pants);
                drawPixel(px + 6, py + j - legOffset, COLORS.pants);
            }
        }

        function drawBubble(x, y, text) {
            const px = Math.floor(x);
            const py = Math.floor(y);
            const width = text.length * 6 + 4;
            const height = 10;

            // Фон облачка
            ctx.fillStyle = COLORS.white;
            ctx.fillRect(px, py, width, height);
            
            // Обводка
            ctx.fillStyle = COLORS.black;
            ctx.fillRect(px, py, width, 1);
            ctx.fillRect(px, py + height - 1, width, 1);
            ctx.fillRect(px, py, 1, height);
            ctx.fillRect(px + width - 1, py, 1, height);

            // Хвостик
            ctx.fillRect(px + 5, py + height, 2, 2);
            ctx.fillRect(px + 4, py + height + 2, 2, 2);

            // Текст
            ctx.fillStyle = COLORS.black;
            ctx.font = '6px monospace';
            ctx.fillText(text, px + 3, py + 7);
        }

        function drawStar(x, y, size) {
            const px = Math.floor(x);
            const py = Math.floor(y);
            
            ctx.fillStyle = COLORS.yellow;
            drawPixel(px, py - size, COLORS.yellow);
            drawPixel(px - size, py, COLORS.yellow);
            drawPixel(px + size, py, COLORS.yellow);
            drawPixel(px, py + size, COLORS.yellow);
            drawPixel(px, py, COLORS.yellow);
        }

        // Инициализация игры
        function initGame() {
            gameState.phase = 'intro';
            gameState.womanX = 10;
            gameState.womanY = canvasHeight - 40;
            gameState.manX = canvasWidth - 40;
            gameState.manY = canvasHeight - 40;
            gameState.hits = 0;
            gameState.animationFrame = 0;
            gameState.walkFrame = 0;
            gameState.hitAnimation = 0;
            gameState.dialogueTimer = 0;
            gameState.womanBubble = '';
            gameState.manBubble = '';
            gameState.stars = [];
            gameState.flash = 0;
            counter.textContent = '';
            restartBtn.classList.remove('show');
        }

        // Обновление игры
        function update() {
            gameState.animationFrame++;

            if (gameState.phase === 'intro') {
                gameState.womanX += 0.5;
                gameState.walkFrame = Math.floor(gameState.animationFrame / 10) % 2;

                if (gameState.womanX >= gameState.manX - 30) {
                    gameState.phase = 'dialogue';
                    gameState.dialogueTimer = 0;
                }
            }

            if (gameState.phase === 'dialogue') {
                gameState.dialogueTimer++;
                
                if (gameState.dialogueTimer === 30) {
                    gameState.womanBubble = 'Работать пойдем?';
                }
                if (gameState.dialogueTimer === 90) {
                    gameState.manBubble = 'Не хочу';
                }
                if (gameState.dialogueTimer === 150) {
                    gameState.phase = 'hitting';
                    gameState.womanBubble = '';
                    gameState.manBubble = '';
                    counter.textContent = `0/${gameState.maxHits}`;
                }
            }

            if (gameState.phase === 'hitting') {
                if (gameState.hitAnimation > 0) {
                    gameState.hitAnimation--;
                }
            }

            if (gameState.phase === 'finished') {
                if (gameState.flash > 0) {
                    gameState.flash--;
                }
            }

            // Обновление звездочек
            gameState.stars = gameState.stars.filter(star => {
                star.x += star.vx;
                star.y += star.vy;
                star.life--;
                return star.life > 0;
            });
        }

        // Отрисовка
        function draw() {
            // Фон
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Земля
            ctx.fillStyle = '#2d4a2b';
            ctx.fillRect(0, canvasHeight - 20, canvasWidth, 20);

            // Вспышка
            if (gameState.flash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${gameState.flash / 30})`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            }

            // Персонажи
            const womanFrame = gameState.phase === 'intro' ? gameState.walkFrame : 0;
            const manFrame = gameState.phase === 'intro' ? gameState.walkFrame : 0;
            const isHit = gameState.hitAnimation > 15;
            
            let batAngle = 0;
            if (gameState.phase === 'hitting' && gameState.hitAnimation > 0) {
                if (gameState.hitAnimation > 15) {
                    batAngle = -Math.PI / 2;
                } else {
                    batAngle = Math.PI / 4;
                }
            }

            drawWoman(gameState.womanX, gameState.womanY, womanFrame, 
                     gameState.phase === 'hitting', batAngle);
            drawMan(gameState.manX, gameState.manY, manFrame, isHit);

            // Облачка с текстом
            if (gameState.womanBubble) {
                drawBubble(gameState.womanX - 10, gameState.womanY - 25, gameState.womanBubble);
            }
            if (gameState.manBubble) {
                drawBubble(gameState.manX - 10, gameState.manY - 25, gameState.manBubble);
            }

            // Звездочки
            gameState.stars.forEach(star => {
                drawStar(star.x, star.y, 2);
            });

            // Финальная надпись
            if (gameState.phase === 'finished' && gameState.flash <= 0) {
                ctx.fillStyle = COLORS.yellow;
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Уф! Выпустила пар', canvasWidth / 2, canvasHeight / 2 - 20);
                ctx.textAlign = 'left';
            }
        }

        // Игровой цикл
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Обработка кликов
        function handleClick(e) {
            e.preventDefault();
            
            if (gameState.phase !== 'hitting') return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Проверка попадания по мужчине
            const manLeft = gameState.manX;
            const manRight = gameState.manX + 10;
            const manTop = gameState.manY;
            const manBottom = gameState.manY + 22;

            if (clickX >= manLeft && clickX <= manRight && 
                clickY >= manTop && clickY <= manBottom) {
                
                gameState.hits++;
                gameState.hitAnimation = 30;
                counter.textContent = `${gameState.hits}/${gameState.maxHits}`;

                // Создание звездочек
                for (let i = 0; i < 5; i++) {
                    gameState.stars.push({
                        x: gameState.manX + 5,
                        y: gameState.manY + 5,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        life: 20
                    });
                }

                // Проверка завершения
                if (gameState.hits >= gameState.maxHits) {
                    gameState.phase = 'finished';
                    gameState.flash = 30;
                    counter.textContent = '';
                    setTimeout(() => {
                        restartBtn.classList.add('show');
                    }, 1000);
                }
            }
        }

        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', handleClick);

        restartBtn.addEventListener('click', () => {
            initGame();
        });

        // Запуск игры
        initGame();
        gameLoop();
    </script>
</body>
</html>
